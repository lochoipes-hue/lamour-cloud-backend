services:
  - type: web
    name: lamour-cloud-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server/index.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://lamour-thiep-cuoi.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: SEPAY_API_KEY
        sync: false
